[Unit]
# Default StartLimitBurst=5/StartLimitIntervalSec=10 (systemd defaults) is
# hit almost immediately by usb-udc-cleanup's ExecStartPre failing fast on
# early boot (see zz-no-rescue-mode.conf/zz-hybris-bridge-libs.conf for the
# underlying cause history) -- confirmed live via pstore console: 5 restarts
# in ~5.5s, then usb-moded gives up silently for the rest of boot, no more
# gadget (g1) config ever created, no SSH/network ever comes up.
StartLimitIntervalSec=120
StartLimitBurst=30

[Service]
RestartSec=2
