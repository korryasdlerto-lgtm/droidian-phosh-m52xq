# НАЙДЕНО 2026-09-01 живьём: firefox-esr (и любое другое приложение,
# запущенное через user-сессию/gnome-session, а не напрямую как
# system-юнит phosh.service) НЕ наследует Environment= из
# phosh.service.d/*.conf -- это два разных дерева процессов
# (system-менеджер vs user-менеджер systemd). Живой journalctl показал
# у firefox: "library libadreno_app_profiles.so not found" + GLSL-
# ошибки на отсутствующих EXT-расширениях -- откат на софтверный
# рендер, дёрганое видео (YouTube). Проверено: у процесса firefox в
# /proc/PID/environ есть только ANDROID_ROOT (видимо, из другого,
# более общего механизма), но НЕТ HYBRIS_LD_LIBRARY_PATH.
#
# environment.d читается ОБОИМИ менеджерами (system и user) при
# старте -- значит эти пути поиска библиотек станут видны вообще
# ВСЕМ процессам в системе, включая user-сессию (Firefox, gnome-
# calculator, droidian-camera и т.д.), не только phosh.
#
# Намеренно НЕ включены сюда EGL_PLATFORM=hwcomposer/
# WLR_HWC_SKIP_VERSION_CHECK -- это специфичные для КОМПОЗИТОРА
# (phoc) настройки выбора бэкенда, форсировать их глобально для ВСЕХ
# клиентских Wayland-приложений рискованно (не нужно и потенциально
# ломает обычный GDK/Wayland-рендер обычных GTK-приложений, которые
# не сами не композят, а просто рисуют через wayland-client EGL).
# Здесь -- только пути поиска .so, что безопасно везде (просто
# дополнительные места для поиска библиотек, не меняет поведение,
# если библиотека не используется).
# v30, подтверждено живьём: этот фикс реально работает -- у процесса
# flashlightd (org.droidian.Flashlightd.service) в /proc/PID/environ
# HYBRIS_LD_LIBRARY_PATH уже присутствует благодаря именно этому файлу.
# Но flashlightd (gstreamer-droid внутри) падает "library
# libandroidicu.so not found" -- эта библиотека живёт НЕ в
# halium-lxc-bridge (курируемая, не полная копия /system), а в
# APEX-модуле Android (com.android.i18n), путь подтверждён живьём:
# /android/system/system/apex/com.android.i18n/lib64/libandroidicu.so.
# Добавлен в общий путь поиска -- та же логика "лишний путь безопасен,
# если не используется", что и раньше.
ANDROID_ROOT=/android
HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64:/android/system/system/apex/com.android.i18n/lib64:/android/system/system/apex/com.android.i18n/lib
