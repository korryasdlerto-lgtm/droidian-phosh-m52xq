[Service]
# Base usb-moded-ssh.service has RestartPreventExitStatus=255, which
# blocks any retry on exactly that exit code. This unit (the rescue
# sshd on the fixed rndis IP) can exit 255 on its very first attempt if
# it tries to bind before the usb0 interface is actually configured
# (After=network.target alone doesn't guarantee interface-level
# readiness) -- and then never gets a second chance for the rest of
# boot. Clear the block and force a retry.
RestartPreventExitStatus=
Restart=on-failure
RestartSec=2
